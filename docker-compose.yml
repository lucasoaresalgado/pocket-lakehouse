# Study-only Spark standalone cluster (~10 GB RAM ceiling, ~1.3 GB idle; see README section 8).
# The project name is pinned to `spark` so the Docker network and container names do not depend on the folder name.
name: spark

x-spark: &spark
  build: .
  image: spark-study:3.5.9
  env_file: [s3.env]   # MinIO AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (see s3.env.example; not in git)
  volumes:
    - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./data:/data
    - ./apps:/apps
    - ./event-logs:/spark-events
  networks: [spark]

# Bash-only HTTP probe (the Spark image does not guarantee curl): healthy when GET / on the given port answers 2xx/3xx.
# Docker only *marks* a container unhealthy; the `autoheal` service below is what restarts it.
x-http-health: &http-health
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # S3-compatible lake. Hard disk limit = bucket quota, applied by scripts/init-minio.sh (the data dir itself is not capped).
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: [minio.env]   # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (see minio.env.example)
    user: "65532:65532"
    volumes:
      - ./minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    mem_limit: 512m
    networks: [spark]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  spark-master:
    <<: *spark
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    restart: unless-stopped
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_DAEMON_MEMORY: 256m
    ports: ["8090:8080", "7077:7077"]
    mem_limit: 512m
    healthcheck:
      <<: *http-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -qE ' (2|3)[0-9][0-9] '"]

  spark-worker-1: &worker
    <<: *spark
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    restart: unless-stopped
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_DAEMON_MEMORY: 256m
      SPARK_WORKER_WEBUI_PORT: 8081
    ports: ["8091:8081"]
    mem_limit: 2560m
    depends_on: [spark-master]
    healthcheck:
      <<: *http-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -qE ' (2|3)[0-9][0-9] '"]

  spark-worker-2:
    <<: *worker
    container_name: spark-worker-2
    restart: unless-stopped
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_DAEMON_MEMORY: 256m
      SPARK_WORKER_WEBUI_PORT: 8082
    ports: ["8092:8082"]
    healthcheck:
      <<: *http-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -qE ' (2|3)[0-9][0-9] '"]

  spark-history:
    <<: *spark
    container_name: spark-history
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    restart: unless-stopped
    environment:
      SPARK_DAEMON_MEMORY: 384m
    ports: ["18080:18080"]
    mem_limit: 640m
    healthcheck:
      <<: *http-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18080 && printf 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -qE ' (2|3)[0-9][0-9] '"]

  # Driver / submit container: run your extraction jobs from here (client mode).
  spark-client:
    <<: *spark
    container_name: spark-client
    command: sleep infinity
    restart: unless-stopped
    environment:
      SPARK_LOCAL_HOSTNAME: spark-client
    ports: ["4040:4040"]
    mem_limit: 1536m
    depends_on: [spark-master]

  # JupyterLab with PySpark (client mode). Limited to 2 cores so it can coexist with spark-client jobs.
  spark-jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    image: spark-study-jupyter:3.5.9
    container_name: spark-jupyter
    env_file: [s3.env]
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.token='' --ServerApp.password=''
    restart: unless-stopped
    environment:
      SPARK_LOCAL_HOSTNAME: spark-jupyter
      STORAGE: s3          # pipeline tables go to MinIO (bucket lake); local-disk storage is disabled
      S3_BUCKET: lake
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/data
      - ./notebooks:/notebooks
      - ./event-logs:/spark-events
    ports: ["127.0.0.1:8888:8888", "127.0.0.1:4041:4040"]
    mem_limit: 2g
    networks: [spark]
    healthcheck:
      <<: *http-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8888 && printf 'GET /api HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -qE ' (2|3)[0-9][0-9] '"]
    depends_on:
      spark-master: {condition: service_started}
      minio: {condition: service_healthy}

  # Restarts any container whose healthcheck reports `unhealthy` (restart: unless-stopped only covers exits/crashes).
  # Needs the Docker socket: that is root-equivalent on the host, so the service is localhost-only, has no ports, and is pinned.
  # Opt-in: deployed only with AUTOHEAL_ACTIVE=1 (see .env.example); with 0 `up -d` also removes a running one.
  autoheal:
    scale: ${AUTOHEAL_ACTIVE:-0}
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 32m
    networks: [spark]

  # MCP server (Streamable HTTP, http://127.0.0.1:8765/mcp) over the Parquet tables in MinIO. Opt-in: MCP_ACTIVE=1.
  # Read-only by default: with MCP_EDIT_ACCESS=0 it gets mcp-access-0.env (a MinIO user that can only read the bucket);
  # with 1 it gets mcp-access-1.env (can also write/delete in the bucket). Both users come from scripts/init-minio.sh.
  mcp:
    build: ./mcp
    image: spark-study-mcp:1
    container_name: mcp
    scale: ${MCP_ACTIVE:-0}
    restart: unless-stopped
    env_file:
      - path: ./mcp-access-${MCP_EDIT_ACCESS:-0}.env
        required: false
    environment:
      MCP_EDIT_ACCESS: ${MCP_EDIT_ACCESS:-0}
      S3_BUCKET: lake
      S3_ENDPOINT: http://minio:9000
    ports: ["127.0.0.1:${MCP_PORT:-8765}:8765"]
    read_only: true
    tmpfs: [/tmp:size=256m]   # DuckDB spill
    mem_limit: 768m
    networks: [spark]
    healthcheck:
      <<: *http-health
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3)"]
    depends_on:
      minio: {condition: service_healthy}

networks:
  spark:
