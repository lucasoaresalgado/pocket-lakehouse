# CI: lint and the offline tests on every pull request to main (and on pushes to main).
# Same base as the project image: Python 3.10, Java 11, PySpark 3.5.9. No MinIO and no network:
# the integration test (mineracao/tests/test_s3_storage.py) stays a manual run.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "ruff==0.17.5"
      # errors only (syntax errors, undefined names); style is not enforced yet
      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # one process per module: STORAGE is fixed when the pipelines are imported
        category: [mineracao, clima, empresas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # the offline tests write their fixtures under /data/_test*
      - run: sudo mkdir -p /data && sudo chmod 777 /data
      - name: offline tests (${{ matrix.category }})
        working-directory: notebooks/${{ matrix.category }}
        run: python -m unittest tests.test_pipelines -v
